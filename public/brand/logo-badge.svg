<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Tarango Electric rural badge">
  <circle cx="200" cy="200" r="190" fill="#F5F1E8" stroke="#222426" stroke-width="8"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#B8871F" stroke-width="3"/>
  <text x="200" y="58" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="18" letter-spacing="4" fill="#222426">TARANGO ELECTRIC</text>
  <!-- simple barn -->
  <g fill="#222426" stroke="none">
    <polygon points="200,92 132,138 132,200 268,200 268,138"/>
    <rect x="145" y="138" width="110" height="62"/>
    <rect x="186" y="158" width="28" height="42" fill="#F5F1E8"/>
    <rect x="248" y="118" width="18" height="82"/>
    <rect x="244" y="108" width="26" height="12"/>
  </g>
  <!-- windmill -->
  <g stroke="#222426" fill="none" stroke-width="3">
    <line x1="300" y1="200" x2="300" y2="128"/>
    <line x1="300" y1="128" x2="278" y2="108"/>
    <line x1="300" y1="128" x2="322" y2="108"/>
    <line x1="300" y1="128" x2="278" y2="148"/>
    <line x1="300" y1="128" x2="322" y2="148"/>
