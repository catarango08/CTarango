  </g>
  <rect x="120" y="214" width="160" height="3" fill="#B8871F"/>
  <text x="200" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#222426">RURAL MISSOURI</text>
  <text x="200" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#8E382F">BOLIVAR · BUFFALO · MARSHFIELD</text>
  <text x="200" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#222426">Show up. Fix it right.</text>
