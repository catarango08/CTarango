version: "3.8"

# Runs on Brittany's MacBook Pro (always-on home server)
# Local path on that machine: ~/Tarango/Home Assistant/
# That same folder is visible on the network as:
#   smb://Brittany's MacBook Pro._smb._tcp.local/Tarango/Home Assistant
#
# To start:  docker compose up -d
# To stop:   docker compose down
# To update: docker compose pull && docker compose up -d

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Chicago
