# Fly.io configuration for the Wireman KB app.
# `fly launch` will prompt for an app name (must be globally unique) and region,
# then update this file. You can also edit `app` / `primary_region` by hand.

app = "ctarango-wireman-kb"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
